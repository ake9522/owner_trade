name: Auto Update Owner Trade Data

on:
  schedule:
    # ตั้งเวลารัน 04:00 น. เวลาไทย (UTC+7) ทุกวันจันทร์–เสาร์ (คือ 21:00 UTC อาทิตย์-ศุกร์)
    - cron: '0 21 * * 0-5'
    # หากต้องการ 21:00 น. (3 ทุ่ม) วันจันทร์–ศุกร์ ให้เปลี่ยนเป็น: '0 14 * * 1-5'
  workflow_dispatch: 

jobs:
  scrape_data:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          pip install --upgrade pip
          pip install pandas requests beautifulsoup4 lxml html5lib selenium

      - name: Run Script
        run: python owner_trade.py

      - name: Save Data to Main Branch
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          git add data_owner_trade/*.csv
          
          if ! git diff --cached --quiet; then
            git commit -m "Auto-update trade data: $(date +'%Y-%m-%d %H:%M')"
            git push origin main
          else
            echo "No changes to update."
          fi
