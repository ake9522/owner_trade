name: Auto Update Owner Trade Data

on:
  schedule:
    # 21:00 UTC = 04:00 น. วันจันทร์–เสาร์ เวลาไทย
    - cron: '0 21 * * 0-5'
  workflow_dispatch: 

jobs:
  scrape_data:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          pip install --upgrade pip
          pip install pandas requests beautifulsoup4 lxml html5lib selenium

      # -------------------------------------------------------------
      # 🚀 ติดตั้งและเชื่อมต่อ Cloudflare WARP ตรงๆ ผ่าน apt
      # -------------------------------------------------------------
      - name: Install & Connect Cloudflare WARP
        run: |
          curl -fsSL https://pkg.cloudflareclient.com/pubkey.gpg | sudo gpg --yes --dearmor --output /usr/share/keyrings/cloudflare-warp-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/cloudflare-warp-archive-keyring.gpg] https://pkg.cloudflareclient.com/ $(lsb_release -cs) main" | sudo tee /etc/apt/sources.list.d/cloudflare-client.list
          sudo apt update && sudo apt install -y cloudflare-warp
          warp-cli --accept-tos registration new || warp-cli --accept-tos register || true
          warp-cli --accept-tos connect
          sleep 3

      - name: Verify IP Address
        run: |
          echo "Current IP:"
          curl -s https://ifconfig.me
          echo ""

      - name: Run Script
        run: python owner_trade.py

      - name: Save Data to Main Branch
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          git add data_owner_trade/*.csv
          
          if ! git diff --cached --quiet; then
            git commit -m "Auto-update trade data: $(date +'%Y-%m-%d %H:%M')"
            git push origin main
          else
            echo "No changes to update."
          fi
