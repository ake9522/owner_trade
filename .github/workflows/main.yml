name: Auto Update Owner Trade Data

on:
  schedule:
    # 21:00 UTC = 04:00 น. วันจันทร์–เสาร์ เวลาไทย
    - cron: '0 21 * * 0-5'
  workflow_dispatch: 

jobs:
  scrape_data:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          pip install --upgrade pip
          pip install pandas requests beautifulsoup4 lxml html5lib selenium

      # -------------------------------------------------------------
      # 🚀 จุดที่เพิ่ม: ติดตั้งและเชื่อมต่อ Cloudflare WARP (ฟรี 100%)
      # -------------------------------------------------------------
      - name: Setup Cloudflare WARP
        uses: fscarmen/warp-action@v1.1.2
        with:
          mode: warp

      # เช็คดูว่า IP เปลี่ยนจาก Microsoft Azure ไปเป็น Cloudflare หรือยัง
      - name: Verify IP Address
        run: |
          echo "Current IP:"
          curl -s https://ifconfig.me
          echo ""

      # -------------------------------------------------------------
      # รันสคริปต์ตามปกติ (ไม่ต้องแก้โค้ด Python)
      # -------------------------------------------------------------
      - name: Run Script
        run: python owner_trade.py

      - name: Save Data to Main Branch
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          git add data_owner_trade/*.csv
          
          if ! git diff --cached --quiet; then
            git commit -m "Auto-update trade data: $(date +'%Y-%m-%d %H:%M')"
            git push origin main
          else
            echo "No changes to update."
          fi
